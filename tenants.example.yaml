# ─────────────────────────────────────────────────────────────────────
# Tenant configuration — one entry per client you assess.
# ─────────────────────────────────────────────────────────────────────
#
# Copy this file to tenants.yaml (gitignored — never commit real client
# identifiers) and fill in real values. Nothing below is a real tenant;
# every value is a placeholder.
#
# Secrets are NEVER stored here. Each "secret_ref" is just a NAME — the
# actual secret value is looked up at runtime from wherever your
# secret_resolver reads from. The default resolver (in run_assessment.py)
# reads environment variables by that exact name, e.g.:
#
#     secret_ref: MSP_SHARED_APP_SECRET
#     -> before running: $env:MSP_SHARED_APP_SECRET = "the real secret"
#
# For anything beyond a single-operator setup, swap in a real vault
# lookup — see run_assessment.py's secret_resolver for where that swap
# happens.
#
# ─────────────────────────────────────────────────────────────────────
# HOW MULTI-TENANT AUTH WORKS
# ─────────────────────────────────────────────────────────────────────
#
# The recommended setup for MSPs: register ONE app in your own Entra
# tenant, set "Supported account types" to "Multiple Entra ID tenants"
# (multi-tenant), and define it once in the "app:" section below. Every
# client then just visits an admin-consent URL and approves it:
#
#     https://login.microsoftonline.com/{their-tenant-id}/adminconsent?client_id={your-app-id}
#
# After that, adding a new client is 3 lines of YAML — no per-client
# app registration to create or track.
#
# IMPORTANT LIMIT: this only works WITHIN one national cloud. A
# multi-tenant app registered in the commercial cloud (GCC rides
# commercial, so GCC is covered too) can reach any commercial/GCC
# tenant — but CANNOT reach a GCC High or DoD tenant. Those live in a
# separate Entra namespace. A GCC High/DoD client needs their own app
# registration — override client_id and secret_ref on that client's
# entry (see Example 4 below).
# ─────────────────────────────────────────────────────────────────────

# ── Shared app registration (applies to all clients by default) ─────
app:
  client_id: "55555555-5555-5555-5555-555555555555"
  secret_ref: "MSP_SHARED_APP_SECRET"    # env var name, NOT the secret itself

# ── Defaults (inherited by every client unless overridden) ──────────
defaults:
  national_cloud: commercial        # commercial | gcc | gcc_high | dod
  planes:
    - cloud                         # cloud | onprem | both for hybrid
  auth_method: app_registration     # app_registration | gdap | interactive

# ── Client list ─────────────────────────────────────────────────────
clients:

  # --- Example 1: minimal cloud-only client (the common case) -------
  # This is all you need for most commercial/GCC clients — 3 lines.
  # client_id and secret_ref come from the shared "app:" section above.
  - tenant_key: acme
    display_name: "Acme Corporation"
    tenant_id: "00000000-0000-0000-0000-000000000000"

  # --- Example 2: on-prem-only client (Active Directory) -------------
  - tenant_key: globex
    display_name: "Globex Corporation"
    planes:
      - onprem
    domain_config:
      domain_controller: "dc01.globex.local"
      base_dn: "DC=globex,DC=local"
      bind_dn: "svc-cmmc@globex.local"
      secret_ref: "GLOBEX_LDAP_BIND_SECRET"
      port: 636
      use_ssl: true
      stale_after_days: 90

  # --- Example 3: hybrid client (both planes, same organization) -----
  # One profile, both planes. This also enables automatic device
  # de-duplication — a device seen from both on-prem and Intune is
  # merged into one report entry, matched by hostname.
  - tenant_key: initech
    display_name: "Initech LLC"
    tenant_id: "22222222-2222-2222-2222-222222222222"
    planes:
      - onprem
      - cloud
    domain_config:
      domain_controller: "dc01.initech.local"
      base_dn: "DC=initech,DC=local"
      bind_dn: "svc-cmmc@initech.local"
      secret_ref: "INITECH_LDAP_BIND_SECRET"

  # --- Example 4: GCC High client (needs its own app registration) ---
  # GCC High / DoD tenants can't use your commercial multi-tenant app.
  # Override client_id and secret_ref for this client only.
  - tenant_key: fedclient
    display_name: "Federal Client Inc"
    tenant_id: "33333333-3333-3333-3333-333333333333"
    national_cloud: gcc_high
    client_id: "77777777-7777-7777-7777-777777777777"    # separate app in gov cloud
    secret_ref: "FEDCLIENT_GCCH_CLIENT_SECRET"            # separate secret

  # --- Example 5: another commercial client using the shared app -----
  # Same shared app as Example 1 — only tenant_id differs.
  - tenant_key: wayne_enterprises
    display_name: "Wayne Enterprises"
    tenant_id: "44444444-4444-4444-4444-444444444444"

  # --- Example 6: client with asset scope exceptions -----------------
  - tenant_key: stark_industries
    display_name: "Stark Industries"
    tenant_id: "66666666-6666-6666-6666-666666666666"
    asset_scope:
      default: cui_asset
      exceptions:
        - identifier_type: hostname
          identifier: STARK-GUEST-WIFI
          category: out_of_scope
          reason: "Guest network, physically separate"
        - identifier_type: hostname
          identifier: STARK-R&D-LAB-PLC
          category: specialized
          reason: "Operational Technology — R&D lab equipment"
